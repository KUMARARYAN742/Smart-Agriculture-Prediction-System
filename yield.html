<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Yield</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-image: url("/static/images/yield.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
        }

        /* Dashboard styles */
        .navbar {
            background-color: #333;
            overflow: hidden;
            width: 100%;
            position: fixed;
            top: 0;
        }

        .navbar a {
            float: left;
            display: block;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            font-size: 17px;
        }

        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }

        .navbar a.active {
            background-color: #4CAF50;
            color: white;
        }

        /* Content area */
        .content {
            margin-top: 50px;
            text-align: center;
            color: white;
            padding: 20px;
        }

        /* Button styling */
        .flash-button {
            display: inline-block;
            padding: 12px 24px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: transparent;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        /* Flash effect on hover */
        .flash-button:hover {
            background-color: white;
            color: black;
            box-shadow: 0 0 20px white;
        }

        /* Centering button */
        .button-container {
            position: absolute;
            top: 70%;
            left: 35%;
            transform: translate(-50%, -50%);
        }

    </style>
</head>
<body>

    <!-- Thin Horizontal Dashboard -->
    <div class="navbar">
        <a href="/" class="active">Home</a>
        <a href="/contact">Contact</a>
        <a href="{{ url_for('index1') }}">Yield</a>
    </div>

    <!-- Button on the image -->
    <div class="button-container">
        <!-- The button now acts as a link to the 'index1' route in Flask -->
        <a href="{{ url_for('index1') }}">
            <button class="flash-button">Get Yield Info</button>
        </a>
    </div>

</body>
</html>

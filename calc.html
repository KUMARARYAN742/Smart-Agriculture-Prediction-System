<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Prediction Calculator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom styles for the form */
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .carousel-inner img {
            height: 200px;
            object-fit: cover;
            width: 100%;
        }
        .container {
            max-width: 1600px;
            margin-top: 10px;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            margin-bottom: 20px;
            text-align: center;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 5px;
            text-align: center;
        }
        .language-toggle {
            margin-bottom: 10px;
            text-align: center;
        }
        .btn-toggle {
            border-radius: 0%;
            width: 100px;
            height: 34px;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-en {
            background-color: #28a745;
        }
        .btn-hi {
            background-color: #007bff;
        }
        .btn-active {
            border: 2px solid #333;
        }
    </style>
</head>
<body>
    <!-- Language Toggle -->


    <div id="carouselExample" class="carousel slide" data-bs-ride="carousel" data-bs-interval="2000">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="{{ url_for('static', filename='images/pexels-blooddrainer-221016.jpg') }}" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="{{ url_for('static', filename='images/pexels-jplenio-1146717.jpg') }}" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="{{ url_for('static', filename='images/pexels-pixabay-50707.jpg') }}" class="d-block w-100" alt="...">
            </div>
        </div>
        <div class="container my-4">
            <div class="language-toggle">
                <button id="btn-en" class="btn btn-toggle btn-en btn-active" onclick="changeLanguage('en')">ENGLISH</button>
                <button id="btn-hi" class="btn btn-toggle btn-hi" onclick="changeLanguage('hi')">HINDI</button>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <div class="container">
        <h2 data-en="Predict Your Food Price" data-hi="अपने खाद्य मूल्य की भविष्यवाणी करें">Predict Your Food Price</h2>
        <form id="price-form" onsubmit="calculatePrice(event)">
            <div class="mb-3">
                <label for="category" class="form-label" data-en="Food Category" data-hi="खाद्य श्रेणी">Food Category</label>
                <select class="form-select" id="category" required>
                    <option value="" data-en="Select Category" data-hi="श्रेणी का चयन करें">Select Category</option>
                    <option value="Fruits" data-en="Fruits" data-hi="फल">Fruits</option>
                    <option value="Vegetables" data-en="Vegetables" data-hi="सब्जियाँ">Vegetables</option>
                    <option value="Crop" data-en="Crop" data-hi="फसल">Crop</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="food-name" class="form-label" data-en="Food Name" data-hi="खाद्य नाम">Food Name</label>
                <input type="text" class="form-control" id="food-name" placeholder="Enter food name" required>
            </div>
            <div class="mb-3">
                <label for="market-price" class="form-label" data-en="Market Price (per kg)" data-hi="बाजार मूल्य (प्रति किलोग्राम)">Market Price (per kg)</label>
                <input type="number" class="form-control" id="market-price" placeholder="Enter market price" step="0.01" min="0" required>
            </div>
            <div class="mb-3">
                <label for="quality" class="form-label" data-en="Quality (%)" data-hi="गुणवत्ता (%)">Quality (%)</label>
                <input type="number" class="form-control" id="quality" placeholder="Enter quality percentage" step="0.01" min="0" max="100" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" data-en="Calculate Price" data-hi="मूल्य की गणना करें">Calculate Price</button>
        </form>

        <div id="result" class="result" style="display: none;">
            <h4 data-en="Predicted Price:" data-hi="भविष्यवाणी की गई कीमत:">Predicted Price:</h4>
            <p id="predicted-price"></p>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript to handle form submission and calculation -->
    <script>
        function calculatePrice(event) {
            event.preventDefault();  // Prevent form from submitting normally

            // Get values from the form
            const category = document.getElementById('category').value;
            const foodName = document.getElementById('food-name').value;
            const marketPrice = parseFloat(document.getElementById('market-price').value);
            const quality = parseFloat(document.getElementById('quality').value);

            // Calculate the predicted price based on quality
            const predictedPrice = (marketPrice * quality) / 100;

            // Display the result
            document.getElementById('predicted-price').textContent = `${predictedPrice.toFixed(2)} per kg`;
            document.getElementById('result').style.display = 'block';
        }

        function changeLanguage(language) {
            const elements = document.querySelectorAll('[data-en], [data-hi]');
            elements.forEach(function (element) {
                element.textContent = element.getAttribute('data-' + language);
            });
            
            document.getElementById('btn-en').classList.toggle('btn-active', language === 'en');
            document.getElementById('btn-hi').classList.toggle('btn-active', language === 'hi');
        }

        // Initialize language based on the default button state
        changeLanguage('en');
    </script>
</body>
</html>

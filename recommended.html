<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommended Crops</title>
    <style>
        /* Style for the top thin black dashboard */
        .top-dashboard {
            background-color: black;
            color: white;
            padding: 25px;
            text-align: center;
            font-size: 40px;
            font:italic;
        }
        
        /* Style for the white navigation dashboard */
        .nav-dashboard {
            background-color: white;
            color: black;
            padding: 10px;
            text-align: center;
            font-size: 18px;
        }

        .nav-dashboard a {
            margin: 0 15px;
            color: black;
            text-decoration: none;
        }

        .nav-dashboard a:hover {
            text-decoration: underline;
            color: blue;
        }

        /* Style for the button inside the image */
        .image-button-container {
            position: relative;
        }

        img {
            width: 100%;
            height: 520px;
        }

        .button-on-image {
            position: absolute;
            top: 65%;
            left: 80%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            background-color: black;
            color: white;
            border-radius:10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .button-on-image:hover {
            background-color:darkblue ;
            color: white;
            box-shadow: 0 0 10px white;
        }
    </style>
</head>
<body>

    <!-- Top black dashboard -->
    <div class="top-dashboard">
        <b>
        RECOMMENDED BEST CROP FOR YOU!...
        </b>
    </div>

    <!-- White navigation dashboard -->
    <div class="nav-dashboard">
        <a href="/">Home</a>
        <a href="#about">About</a>
        <a href="/croprecommended">Recommended</a>
    </div>

    <!-- Image with button -->
    <div class="image-button-container">
        <img src="{{ url_for('static', filename='images/recomended.jpg') }}" alt="Crop Image">
        <button class="button-on-image" onclick="window.location.href='/croprecommended'">Recommended Crops</button>
    </div>

</body>
</html>

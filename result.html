<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Food Quality Prediction Result</h1>
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ name }}</h5>
                <p class="card-text">Predicted Food Quality: {{ prediction }}</p>
            </div>
        </div>
        <div class="text-center mt-3">
            <a href="{{ url_for('index') }}" class="btn btn-primary">Make Another Prediction</a>
        </div>
    </div>
</body>
</html>
